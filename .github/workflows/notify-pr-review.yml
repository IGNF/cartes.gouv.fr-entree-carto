name: Rappel PR en attente de review

on:
  schedule:
    # Tous les jours ouvrés à 9h00 (heure de Paris, UTC+1/+2)
    # - cron: '0 8 * * 1-5'
  workflow_dispatch: {}   # permet de le lancer manuellement pour tester

jobs:
  notify-pr-review:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les PR en attente et notifier Discord
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STALE_DAYS: '3'          # <-- seuil en jours, à ajuster
          IGNORE_DRAFTS: 'true'    # <-- ignorer les PR en brouillon
        with:
          script: |
            const staleDays = parseInt(process.env.STALE_DAYS, 10);
            const ignoreDrafts = process.env.IGNORE_DRAFTS === 'true';
            const webhookUrl = process.env.DISCORD_WEBHOOK_URL;

            if (!webhookUrl) {
              core.setFailed('DISCORD_WEBHOOK_URL manquant dans les secrets du repo.');
              return;
            }

            const { owner, repo } = context.repo;
            const now = Date.now();
            const msPerDay = 1000 * 60 * 60 * 24;

            // Récupère toutes les PR ouvertes (pagination incluse)
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const stalePrs = [];

            for (const pr of pulls) {
              if (ignoreDrafts && pr.draft) continue;

              const ageDays = (now - new Date(pr.created_at).getTime()) / msPerDay;
              if (ageDays < staleDays) continue;

              // Reviewers individuels demandés
              const requestedUsers = (pr.requested_reviewers || []).map(u => u.login);
              // Teams demandées (ex: "frontend-team")
              const requestedTeams = (pr.requested_teams || []).map(t => `@${t.slug} (team)`);

              // Vérifie s'il y a déjà eu au moins une review (approve/changes/comment)
              const reviews = await github.rest.pulls.listReviews({
                owner,
                repo,
                pull_number: pr.number,
              });
              const hasReview = reviews.data.length > 0;

              // On ne remonte que les PR sans aucune review ET avec des reviewers en attente,
              // ou totalement sans reviewer assigné (à signaler aussi, c'est souvent le vrai problème)
              const pendingReviewers = [...requestedUsers, ...requestedTeams];

              if (!hasReview) {
                stalePrs.push({
                  number: pr.number,
                  title: pr.title,
                  url: pr.html_url,
                  author: pr.user.login,
                  ageDays: Math.floor(ageDays),
                  pendingReviewers,
                });
              }
            }

            if (stalePrs.length === 0) {
              core.info('Aucune PR en attente au-delà du seuil, rien à notifier.');
              return;
            }

            // Construit le message Discord
            const lines = stalePrs
              .sort((a, b) => b.ageDays - a.ageDays)
              .map(pr => {
                const reviewers = pr.pendingReviewers.length > 0
                  ? pr.pendingReviewers.join(', ')
                  : '⚠️ aucun reviewer assigné';
                return `• **#${pr.number}** [${pr.title}](${pr.url}) — ouverte par \`${pr.author}\`, en attente depuis **${pr.ageDays}j** → ${reviewers}`;
              });

            const content = [
              `📋 **PR en attente de review (> ${staleDays}j) sur \`${repo}\`**`,
              '',
              ...lines,
            ].join('\n');

            // Discord limite un message à 2000 caractères : on tronque si besoin
            const finalContent = content.length > 1900
              ? content.slice(0, 1900) + '\n… (liste tronquée)'
              : content;

            const res = await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content: finalContent }),
            });

            if (!res.ok) {
              const text = await res.text();
              core.setFailed(`Échec de l'envoi Discord (${res.status}): ${text}`);
            }
